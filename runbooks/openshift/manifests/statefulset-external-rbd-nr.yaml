# PostgreSQL StatefulSet — zone-local RBD via external Ceph (ceph-external-zone-nr)
# Zone affinity values must match topology/zones.env and Ceph CRUSH bucket names.
# Deploy with External-Ceph-Cluster.md Step 6
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pg-multizone
spec:
  serviceName: "postgres"
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                    - zone-a
                    - zone-b
                    - zone-c
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-13
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: pg-config
        - secretRef:
            name: pg-secret
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRESQL_USER)"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRESQL_USER)"]
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ceph-external-zone-nr
      resources:
        requests:
          storage: 10Gi
